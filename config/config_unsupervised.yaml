protected_attributes: [sex, personal_status_sex, foreign_worker]

imputation_policy:
  numeric:
    - {max_share: 0.10, strategy: median}
    - {max_share: 0.40, strategy: median, add_indicator: true}
    - {max_share: 1.00, strategy: constant, fill_value: 0, add_indicator: true}
  categorical:
    - {max_share: 0.10, strategy: most_frequent}
    - {max_share: 1.00, strategy: constant, fill_value: "Missing"}

imputation_routing:
  numeric_continuous: numeric
  numeric_discrete: numeric
  categorical_nominal: categorical
  categorical_ordinal: categorical
  complaint_time: numeric
  payment_signal: numeric
  dfs_features: numeric

ordinal_categories:
  employment_since: [unemployed, "<1 year", "1-4 years", "4-7 years", ">=7 years"]
  job:
    - unemployed/unskilled non-resident
    - unskilled resident
    - skilled employee
    - management/highly qualified

transform_policy:
  additive:
    numeric_continuous:
      - interactions: {ratios: [[credit_amount, duration], [duration, age]], epsilon: 1.0e-5}
    numeric_discrete: []
    categorical_nominal: [one_hot]
    categorical_ordinal: [ordinal_encoder]
    complaint_time:
      - cyclic_time: {periods: {complaint_month: 12, complaint_weekday: 7}}
    payment_signal: []
    dfs_features: []

reference:
  repo: ../lab_03
  path: data/raw/lab2_feature_matrix.csv
  rev: null
  expected_md5: c6cfcbbe784ee2407a235ddb309f9736

spaces:
  random_state: 42
  wide_components: 30
  kde_components: 4

gmm:
  c_range: [1, 15]
  covariance_types: [spherical, diag, full]
  stability_seeds: 10
  ari_threshold: 0.8
  bootstrap_resamples: 20

kde:
  grid_factors: [0.2, 5.0]
  grid_points: 25
  cv_folds: 5
  anomaly_share: 0.05

manifold:
  max_points: 3000
  n_neighbors: 10
  tsne_perplexities: [5, 30, 50]
  tsne_default_perplexity: 30

profiles:
  top_k: 5
  risk_share: 0.05
